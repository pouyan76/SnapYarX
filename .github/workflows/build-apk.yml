
name: Build SPEX YAR APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore release keystore
        env:
          SNAPYAR_KEYSTORE: ${{ secrets.SNAPYAR_KEYSTORE }}
        run: |
          test -n "$SNAPYAR_KEYSTORE" || { echo "SNAPYAR_KEYSTORE secret is empty or unavailable"; exit 1; }
          printf '%s' "$SNAPYAR_KEYSTORE" | base64 --decode > app/snapyar-release.jks
          test -s app/snapyar-release.jks || { echo "Decoded keystore file is empty"; exit 1; }

      - name: Verify release keystore
        env:
          SNAPYAR_STORE_PASSWORD: ${{ secrets.SNAPYAR_STORE_PASSWORD }}
          SNAPYAR_KEY_ALIAS: ${{ secrets.SNAPYAR_KEY_ALIAS }}
        run: |
          echo "5a374f9f078007603a1ea2bd41669b516682cc5eec0fb482295c36b162a395f3  app/snapyar-release.jks" | sha256sum --check
          keytool -list -keystore app/snapyar-release.jks -storepass "$SNAPYAR_STORE_PASSWORD" -alias "$SNAPYAR_KEY_ALIAS" > /dev/null
          echo "Keystore file, store password, and alias are valid."

      - name: Build signed release APK
        env:
          SNAPYAR_STORE_PASSWORD: ${{ secrets.SNAPYAR_STORE_PASSWORD }}
          SNAPYAR_KEY_ALIAS: ${{ secrets.SNAPYAR_KEY_ALIAS }}
        run: gradle assembleRelease

      - name: Remove keystore from workspace
        if: always()
        run: rm -f app/snapyar-release.jks

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: snapyar-x-release-apk
          path: app/build/outputs/apk/release/app-release.apk
